[package]
name = "this-me"
version = "0.3.0"
edition = "2021"
authors = ["suiGn <admin@neurons.me>"]
description = "Rust ground for the modern .me semantic kernel."
license = "MIT OR Apache-2.0"
repository = "https://github.com/neurons-me/this.me"
homepage = "https://neurons.me"
readme = "README.md"
keywords = ["semantic-kernel", "memory", "identity", "cryptography"]
categories = ["data-structures", "cryptography"]
default-run = "me"

[dependencies]
serde_json = "1"
sha3 = "0.10"

[[bin]]
name = "me"
path = "src/main.rs"
