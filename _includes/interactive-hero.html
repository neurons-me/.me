<!--
  Interactive hero: live keccak-256 identity hash demo.
  Included ONLY by index.md for the Jekyll-built neurons-me.github.io/.me/ site.
  Deliberately NOT part of README.md — GitHub and npm sanitize <script> tags
  and inline on* handlers out of rendered markdown, so this would be dead
  weight (or visibly ugly raw HTML) anywhere README.md is shown directly.

  README.md (included right below by index.md) carries its own static
  version of this same hero, wrapped in <div class="static-hero"> — that
  copy is what GitHub/npm show. This page already has the live one above,
  so hide the static duplicate here without touching README.md itself.

  README.md's own leading "# .me" / "Own your knowledge." (wrapped in
  <div class="readme-intro">) is the same redundancy one level up — this
  page's own title/nav and this hero already establish both, so hide that
  too rather than showing it a second time right below the hero.
-->
<style>
  .static-hero, .readme-intro { display: none; }
  /* Same max-width as the table below on purpose: .me-hero-tag positions
     itself (right:10px) relative to THIS element, not the table -- if the
     wrap were left unconstrained it spans the full content column, and on
     a wide screen the tag ends up floating far past the card's own right
     edge instead of sitting on it. */
  .me-hero-wrap { position: relative; max-width: 560px; }
  .me-hero-table { width: 100%; }
  /* The site theme draws borders on every table/td (and GitHub-style zebra
     backgrounds on rows); this table is only layout, so drop the frame. */
  .me-hero-table, .me-hero-table tr, .me-hero-table td {
    border: none !important; background: transparent !important;
  }
  /* min-width only above ~640px: 260px (left, fixed) + 300px (right, min)
     overflows a phone viewport, so mobile keeps the old content-based
     sizing and only wider screens get the deliberately roomier card. */
  @media (min-width: 640px) {
    .me-hero-right { min-width: 300px; }
  }
  .me-hero-tag {
    position: absolute; top: 6px; right: 10px;
    font-family: monospace; font-size: 0.62rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: #6b7280; opacity: 0.8; white-space: nowrap;
  }
  .root-cards { display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; }
  .root-cards a.card { display:flex; flex-direction:column; align-items:center; gap:6px; min-width:96px; padding:12px 14px; border:1px solid rgba(127,127,127,.35); border-radius:12px; text-decoration:none; color:inherit; font-weight:700; }
  .root-cards svg { width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
</style>
<div class="me-hero-wrap">
<span class="me-hero-tag">A Cryptographic Identity.</span>
<table class="me-hero-table" border="0" cellspacing="0" cellpadding="0" style="border:none;">
  <tr>
    <td width="260" align="center" valign="middle">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="https://res.cloudinary.com/dkwnxf6gm/image/upload/v1760915741/this.me-removebg-preview_1_nrj6pe.png" />
        <img id="me-identity-img" src="./docs/assets/this.me.png" alt=".me as a coordinate" width="200" title="ID Hash" />
      </picture>
      <div id="me-identity-hash" title="ID Hash" style="margin-top:6px; font-family:monospace; font-size:0.65rem; color:#6b7280; opacity:0.75; letter-spacing:0.02em; cursor:default;">…</div>
      <a href="https://neurons-me.github.io/.me/docs/Seed.html" target="blank" title="identityHash = keccak256(&quot;this.me/identity:v1::&quot; + seed) — read the SEED doc" style="display:block; margin-top:2px; font-family:monospace; font-size:0.6rem; color:#58a6ff; letter-spacing:0.03em; text-decoration:underline;">keccak-256</a>
    </td>
    <td class="me-hero-right" valign="middle">
      <h2>Hello, I am <input
        id="me-seed-input"
        type="text"
        placeholder=".me"
        aria-label="Type your own name"
        spellcheck="false"
        autocomplete="off"
        oninput="this.style.width = ((this.value.length || this.placeholder.length) + 1) + 'ch'; updateMeIdentityHash();"
        onfocus="this.dataset.ph = this.dataset.ph || this.placeholder; this.placeholder = ''; updateMeIdentityHash();"
        onblur="if (!this.value) this.placeholder = this.dataset.ph; updateMeIdentityHash();"
        style="font: inherit; font-weight: 700; font-family: monospace; color: inherit; background: transparent; border: none; border-bottom: 2px solid currentColor; outline: none; width: 4ch; padding: 0 2px;"
      ></h2>
      <h3 style="margin-top: 6px;"><input
        id="me-secret-input"
        type="password"
        placeholder="&lt;secret&gt;"
        aria-label="Secret — feeds the hash, stays local, never a URL"
        spellcheck="false"
        autocomplete="off"
        oninput="this.style.width = ((this.value.length || this.placeholder.length) + 1) + 'ch'; updateMeIdentityHash();"
        style="font: inherit; font-weight: 500; font-family: monospace; color: #8b949e; background: transparent; border: none; border-bottom: 1px solid currentColor; outline: none; width: 9ch; padding: 0 2px;"
      ></h3>
      <div class="root-cards">
        <a class="card" href="https://neurons-me.github.io/.me/docs/"><svg class="card-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="4"/><path d="M7 8.5v7M10 12h8"/></svg><span class="card-title">Docs</span></a>
        <a class="card" href="https://neurons-me.github.io/.me/tests/"><svg class="card-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5c5-2.5 13-2.5 18 0"/><path d="M3.5 11.5c5-4.5 12-4.5 17 0c-5 4.5-12 4.5-17 0z"/><circle cx="12" cy="11.5" r="2"/><path d="M10 15.2 8 20.5M14 15.2c.5 3 4 4 4.5 1.5"/></svg><span class="card-title">Tests</span></a>
        <a class="card" href="https://neurons-me.github.io/.me/docs/Benchmarks/"><svg class="card-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v16.5M8 20h8M4.5 7.5h15"/><path d="M4.5 7.5 2 14h5zM19.5 7.5 17 14h5z"/><path d="M2 14a2.5 2.5 0 0 0 5 0M17 14a2.5 2.5 0 0 0 5 0"/></svg><span class="card-title">Benchmarks</span></a>
      </div>
    </td>
  </tr>
</table>
</div>

<script src="https://cdn.jsdelivr.net/npm/js-sha3@0.9.3/build/sha3.min.js"></script>
<script>
  // Mirrors me.ts exactly (see me/Typescript/src/me.ts):
  //   compoundSeed = keccak256("me.seed/compound:v1::" + who + "::" + secret)
  //   identityHash = keccak256("this.me/identity:v1::" + seed)
  // Two real inputs feed the hash: who + secret. No namespace is needed.
  // Secret stays in this input only — never read into a URL, never sent.
  function updateMeIdentityHash() {
    var input = document.getElementById('me-seed-input');
    var secretInput = document.getElementById('me-secret-input');
    var img = document.getElementById('me-identity-img');
    var label = document.getElementById('me-identity-hash');
    if (!input || !img || !label || typeof keccak256 !== 'function') return;
    var who = input.value || input.placeholder || '.me';
    var secret = secretInput ? secretInput.value : '';
    var seed = secret
      ? keccak256('me.seed/compound:v1::' + who + '::' + secret)
      : who;
    var hash = keccak256('this.me/identity:v1::' + seed);
    var tooltip = 'ID Hash: ' + hash;
    img.title = tooltip;
    label.title = tooltip;
    label.textContent = hash.slice(0, 8) + '…' + hash.slice(-6);

  }
  updateMeIdentityHash();
</script>
