<!--
  Interactive hero: live keccak-256 identity hash demo.
  Included ONLY by index.md for the Jekyll-built neurons-me.github.io/.me/ site.
  Deliberately NOT part of README.md — GitHub and npm sanitize <script> tags
  and inline on* handlers out of rendered markdown, so this would be dead
  weight (or visibly ugly raw HTML) anywhere README.md is shown directly.

  README.md (included right below by index.md) carries its own static
  version of this same hero, wrapped in <div class="static-hero"> — that
  copy is what GitHub/npm show. This page already has the live one above,
  so hide the static duplicate here without touching README.md itself.

  README.md's own leading "# .me" / "Own your knowledge." (wrapped in
  <div class="readme-intro">) is the same redundancy one level up — this
  page's own title/nav and this hero already establish both, so hide that
  too rather than showing it a second time right below the hero.
-->
<style>.static-hero, .readme-intro { display: none; }</style>
<table border="0" cellspacing="0" cellpadding="0" style="border:none;">
  <tr>
    <td width="260" align="center" valign="middle">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="https://res.cloudinary.com/dkwnxf6gm/image/upload/v1760915741/this.me-removebg-preview_1_nrj6pe.png" />
        <img id="me-identity-img" src="./docs/assets/this.me.png" alt=".me as a coordinate" width="200" title="ID Hash" />
      </picture>
      <div id="me-identity-hash" title="ID Hash" style="margin-top:6px; font-family:monospace; font-size:0.65rem; color:#6b7280; opacity:0.75; letter-spacing:0.02em; cursor:default;">…</div>
      <a href="https://neurons-me.github.io/.me/docs/Seed.html" target="blank" title="identityHash = keccak256(&quot;this.me/identity:v1::&quot; + seed) — read the SEED doc" style="display:block; margin-top:2px; font-family:monospace; font-size:0.6rem; color:#58a6ff; letter-spacing:0.03em; text-decoration:underline;">keccak-256</a>
      <div id="me-namespace-display" title="Where, not what generates the hash" style="margin-top:10px; font-family:monospace; font-size:0.62rem; color:#58a6ff; opacity:0.85; letter-spacing:0.01em; cursor:default;">.me</div>
    </td>
    <td valign="middle">
      <h2>Hello, I am <input
        id="me-seed-input"
        type="text"
        placeholder=".me"
        aria-label="Type your own name"
        spellcheck="false"
        autocomplete="off"
        oninput="this.style.width = ((this.value.length || this.placeholder.length) + 1) + 'ch'; updateMeIdentityHash();"
        onfocus="this.dataset.ph = this.dataset.ph || this.placeholder; this.placeholder = ''; updateMeIdentityHash();"
        onblur="if (!this.value) this.placeholder = this.dataset.ph; updateMeIdentityHash();"
        style="font: inherit; font-weight: 700; font-family: monospace; color: inherit; background: transparent; border: none; border-bottom: 2px solid currentColor; outline: none; width: 4ch; padding: 0 2px;"
      ></h2>
      <h2><input
        id="me-secret-input"
        type="password"
        placeholder="<secret>"
        aria-label="Secret — feeds the hash, stays local, never a URL"
        spellcheck="false"
        autocomplete="off"
        oninput="this.style.width = ((this.value.length || this.placeholder.length) + 1) + 'ch'; updateMeIdentityHash();"
        style="font: inherit; font-weight: 700; font-family: monospace; color: inherit; background: transparent; border: none; border-bottom: 2px solid currentColor; outline: none; width: 9ch; padding: 0 2px;"
      ></h2>
      <h2><input
        id="me-namespace-input"
        type="text"
        placeholder="<namespace>"
        aria-label="Namespace — where, not what generates the hash"
        spellcheck="false"
        autocomplete="off"
        oninput="this.style.width = ((this.value.length || this.placeholder.length) + 1) + 'ch'; updateMeIdentityHash();"
        style="font: inherit; font-weight: 700; font-family: monospace; color: inherit; background: transparent; border: none; border-bottom: 2px solid currentColor; outline: none; width: 12ch; padding: 0 2px;"
      ></h2>
      <h3><a href="https://neurons-me.github.io/.me/docs" target="blank">⌬ Docs</a>   </h3>
    </td>
  </tr>
</table>

<script src="https://cdn.jsdelivr.net/npm/js-sha3@0.9.3/build/sha3.min.js"></script>
<script>
  // Mirrors me.ts exactly (see me/Typescript/src/me.ts):
  //   compoundSeed = keccak256("me.seed/compound:v1::" + who + "::" + secret)
  //   identityHash = keccak256("this.me/identity:v1::" + seed)
  // Two real inputs feed the hash: who + secret. Namespace is a third,
  // separate field on purpose — it's cleaker's concern (WHERE this
  // identity is claimed), not this.me's (WHAT generates the hash). It
  // composes a display string (who.namespace) but is never hashed in.
  // Secret stays in this input only — never read into a URL, never sent.
  function updateMeIdentityHash() {
    var input = document.getElementById('me-seed-input');
    var secretInput = document.getElementById('me-secret-input');
    var nsInput = document.getElementById('me-namespace-input');
    var img = document.getElementById('me-identity-img');
    var label = document.getElementById('me-identity-hash');
    var nsLabel = document.getElementById('me-namespace-display');
    if (!input || !img || !label || typeof keccak256 !== 'function') return;
    var who = input.value || input.placeholder || '.me';
    var secret = secretInput ? secretInput.value : '';
    var seed = secret
      ? keccak256('me.seed/compound:v1::' + who + '::' + secret)
      : who;
    var hash = keccak256('this.me/identity:v1::' + seed);
    var tooltip = 'ID Hash: ' + hash;
    img.title = tooltip;
    label.title = tooltip;
    label.textContent = hash.slice(0, 8) + '…' + hash.slice(-6);

    if (nsLabel) {
      // No placeholder fallback here on purpose: "<namespace>" is a template
      // marker, not a real example like the username input's ".me" -- composing
      // "who.<namespace>" would show that literal marker as if it were real.
      var ns = nsInput ? nsInput.value : '';
      nsLabel.textContent = ns ? (who + '.' + ns) : who;
    }
  }
  updateMeIdentityHash();
</script>
