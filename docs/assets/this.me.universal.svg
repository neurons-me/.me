<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="500" height="500">
  <g fill="none" stroke="#757575" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- outer hexagon -->
    <polygon points="50,12 82.9,31 82.9,69 50,88 17.1,69 17.1,31" />
    <!-- inner hexagon -->
    <polygon points="50,30 67.3,40 67.3,60 50,70 32.7,60 32.7,40" />
    <!-- spokes: outer vertex -> matching inner vertex -->
    <line x1="50" y1="12" x2="50" y2="30" />
    <line x1="82.9" y1="31" x2="67.3" y2="40" />
    <line x1="82.9" y1="69" x2="67.3" y2="60" />
    <line x1="50" y1="88" x2="50" y2="70" />
    <line x1="17.1" y1="69" x2="32.7" y2="60" />
    <line x1="17.1" y1="31" x2="32.7" y2="40" />
  </g>
</svg>
