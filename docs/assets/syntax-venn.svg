      <stop offset="0%" stop-color="#8fd9c8"/>
      <stop offset="50%" stop-color="#48a090"/>
      <stop offset="100%" stop-color="#245c52"/>
    </linearGradient>
    <filter id="syntaxVennGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
